# Long v3 — D-019 bold dark art direction (dark scene backgrounds, headline on every
# explanation scene, caption box). Same example, data and clarity rules as the short (CLAUDE.md "Clarity rules",
# docs/HANDOFF_CLARITY.md). Chapter structure kept:
#   1 problem → 2 intuition → 3 mechanism → 4 real-world example → 5 common mistakes → 6 recap
# DRAFT OUTLINE-LEVEL SCRIPT (~3 min). It is NOT yet the 8–12 min deliverable; each chapter
# needs expansion and fact-checking before editorial approval. All data is illustrative.
scenes:
  # ── 1 · MASALAH ────────────────────────────────────────────────────────────
  - id: hook
    title: "Fakta aneh"
    purpose: "Fakta konkret yang terdengar aneh: dua hal naik bersamaan."
    narration: "Tahu nggak? Saat penjualan es krim naik, kasus orang tenggelam juga ikut naik."
    captions:
      - text: "Tahu nggak?"
      - text: "Saat penjualan es krim naik,"
        highlight: ["es krim"]
      - text: "kasus orang tenggelam"
        highlight: ["tenggelam"]
      - text: "juga ikut naik."
        highlight: ["ikut naik"]
    character: {presenter: "off", mascot: "on", mascot_pose: "wave", expression: "happy"}
    background: "purple"
    template: "title_question"
    props:
      chapter: "1 · Masalah"
      headline: "FAKTA ANEH SOAL DATA"
      headline_accent: ["DATA"]
      side_icons:
        - {icon: ice_cream, label: "Es krim", trend: up}
        - {icon: swimmer, label: "Tenggelam", trend: up}
    duration_hint_seconds: 5.5
    beats:
      - {at: 0.02, target: headline, action: slide}
      - {at: "word:es", target: side-0, action: pop}
      - {at: "word:tenggelam", target: side-1, action: pop}
      - {at: "word:ikut", target: rule, action: draw}
      - {at: "word:ikut", target: nodi, action: "expr:surprised"}

  - id: tempting
    title: "Kesimpulan menggoda"
    purpose: "Menyuarakan lompatan logika yang keliru, tanpa menjawabnya."
    narration: "Banyak orang langsung menyimpulkan: es krim penyebabnya. Tapi, benarkah begitu?"
    captions:
      - text: "Banyak orang langsung menyimpulkan:"
      - text: "es krim penyebabnya."
        highlight: ["penyebabnya"]
      - text: "Tapi, benarkah begitu?"
        highlight: ["benarkah"]
    character: {presenter: "off", mascot: "on", mascot_pose: "shrug", expression: "skeptical"}
    background: "coral"
    template: "title_question"
    props:
      headline: "ES KRIM → TENGGELAM?"
      side_icons:
        - {icon: ice_cream}
        - {icon: swimmer}
    duration_hint_seconds: 5.0
    beats:
      - {at: 0.02, target: headline, action: pop}
      - {at: "word:es", target: side-0, action: pop}
      - {at: "word:penyebabnya", target: side-1, action: pop}
      - {at: "word:benarkah", target: headline, action: highlight}
      - {at: "word:benarkah", target: rule, action: draw}

  # ── 2 · INTUISI ────────────────────────────────────────────────────────────
  - id: data
    title: "Datanya"
    purpose: "Memperlihatkan dua variabel yang bergerak bersama, dengan r terhitung."
    narration: "Mari kita lihat datanya selama setahun. Dua garis ini naik turun hampir bareng."
    captions:
      - text: "Mari kita lihat"
      - text: "datanya selama setahun."
        highlight: ["setahun"]
      - text: "Dua garis ini naik turun"
      - text: "hampir bareng."
        highlight: ["bareng"]
    character: {presenter: "off", mascot: "off"}
    background: "navy_dark"
    template: "paired_trend"
    props:
      headline: "DATA SETAHUN"
      headline_accent: ["SETAHUN"]
      variables: ["Penjualan es krim", "Kasus tenggelam"]
      icons: [ice_cream, swimmer]
      series:
        - [30, 34, 45, 57, 71, 84, 93, 88, 72, 52, 39, 31]
        - [14, 12, 19, 20, 29, 30, 38, 30, 31, 17, 17, 11]
      x_labels: ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"]
      conclusion: "Naik turun bareng!"
      show_r: true
      data_label: "Ilustrasi"
    duration_hint_seconds: 7.0
    source_notes:
      - "Data ilustratif; r dihitung dari angka di spec, bukan statistik faktual."
    beats:
      - {at: 0.0, target: headline, action: slide}
      - {at: 0.02, target: axes, action: draw}
      - {at: "word:datanya", target: chart-0, action: draw, duration: 1.6}
      - {at: "word:garis", target: chart-1, action: draw, duration: 1.6}
      - {at: "word:bareng", target: conclusion, action: pop}
      - {at: "word:bareng", target: chart-0, action: highlight}
      - {at: "word:bareng", target: chart-1, action: highlight}
      - {at: 0.85, target: r, action: pop}
      - {at: 0.92, target: label, action: pop}

  - id: name-correlation
    title: "Korelasi"
    purpose: "Memberi nama pada pola yang barusan terlihat, terikat pada contohnya."
    narration: "Pola seperti ini disebut korelasi: dua hal yang naik atau turun bersamaan."
    captions:
      - text: "Pola seperti ini disebut korelasi:"
        highlight: ["korelasi"]
      - text: "dua hal yang naik"
      - text: "atau turun bersamaan."
    character: {presenter: "off", mascot: "off"}
    background: "navy"
    template: "definition_card"
    props:
      headline: "NAMANYA KORELASI"
      headline_accent: ["KORELASI"]
      term: "KORELASI"
      definition: "Dua hal yang naik atau turun bersamaan."
      data_label: "ISTILAH"
      icon: together
      icon_label: "Di sini: es krim & tenggelam"
    duration_hint_seconds: 5.5
    beats:
      - {at: 0.0, target: headline, action: slide}
      - {at: 0.0, target: card, action: pop}
      - {at: "word:korelasi", target: term, action: pop}
      - {at: "word:korelasi", target: label, action: pop}
      - {at: "word:dua", target: definition, action: slide}
      - {at: 0.02, target: icon, action: pop}
      - {at: "word:turun", target: icon, action: highlight}

  - id: strong-not-cause
    title: "Kuat belum tentu sebab"
    purpose: "Memisahkan kekuatan hubungan dari sebab-akibat."
    narration: "Hubungannya sangat kuat. Tapi kuat belum tentu berarti yang satu menyebabkan yang lain."
    captions:
      - text: "Hubungannya sangat kuat."
        highlight: ["kuat"]
      - text: "Tapi kuat belum tentu berarti"
      - text: "yang satu menyebabkan"
        highlight: ["menyebabkan"]
      - text: "yang lain."
    character: {presenter: "off", mascot: "off"}
    background: "purple"
    template: "question_link"
    props:
      headline: "KUAT BELUM TENTU SEBAB"
      headline_accent: ["SEBAB"]
      labels:
        - {label: "Hubungan kuat", icon: together}
        - {icon: question}
        - {label: "Sebab-akibat?", icon: domino}
      supporting_text: "Kuat ≠ menyebabkan"
    duration_hint_seconds: 6.5
    beats:
      - {at: 0.0, target: headline, action: slide}
      - {at: 0.02, target: item-0, action: pop}
      - {at: "word:belum", target: link-0, action: draw}
      - {at: "word:belum", target: item-1, action: pop}
      - {at: "word:menyebabkan", target: link-1, action: draw}
      - {at: "word:menyebabkan", target: item-2, action: pop}
      - {at: 0.88, target: supporting, action: pop}

  # ── 3 · MEKANISME ──────────────────────────────────────────────────────────
  - id: hidden-factor
    title: "Faktor ketiga"
    purpose: "Mencoret hubungan yang diasumsikan, lalu menggambar penyebab sebenarnya."
    narration: "Lalu apa yang sebenarnya terjadi? Bukan es krim. Ada faktor ketiga: cuaca panas. Saat panas, orang beli es krim, dan lebih banyak yang berenang."
    captions:
      - text: "Lalu apa yang sebenarnya terjadi?"
      - text: "Bukan es krim."
        highlight: ["Bukan"]
      - text: "Ada faktor ketiga:"
        highlight: ["faktor ketiga"]
      - text: "cuaca panas."
        highlight: ["panas"]
      - text: "Saat panas,"
      - text: "orang beli es krim,"
        highlight: ["es krim"]
      - text: "dan lebih banyak yang berenang."
        highlight: ["berenang"]
    character: {presenter: "off", mascot: "off"}
    background: "teal"
    template: "causal_diagram"
    props:
      headline: "FAKTOR KETIGA"
      headline_accent: ["KETIGA"]
      nodes:
        - {id: weather, label: "Cuaca panas", icon: sun}
        - {id: ice_cream, label: "Beli es krim", icon: ice_cream}
        - {id: swim, label: "Lebih banyak berenang", icon: swimmer}
      false_link: true
      data_label: "Ilustrasi"
    duration_hint_seconds: 10.5
    beats:
      - {at: 0.0, target: headline, action: slide}
      - {at: 0.0, target: node-1, action: pop}
      - {at: 0.0, target: node-2, action: pop}
      - {at: 0.03, target: false-link, action: draw}
      - {at: "word:Bukan", target: false-x, action: pop}
      - {at: "word:cuaca", target: node-0, action: pop}
      - {at: "word:beli", target: arrow-1, action: draw}
      - {at: "word:beli", target: node-1, action: highlight}
      - {at: "word:berenang", target: arrow-2, action: draw}
      - {at: "word:berenang", target: node-2, action: highlight}
      - {at: 0.95, target: label, action: pop}

  - id: name-confounder
    title: "Confounder"
    purpose: "Memberi nama pada faktor ketiga, terikat pada contohnya."
    narration: "Faktor tersembunyi seperti ini disebut confounder, atau variabel perancu."
    captions:
      - text: "Faktor tersembunyi seperti ini"
      - text: "disebut confounder,"
        highlight: ["confounder"]
      - text: "atau variabel perancu."
        highlight: ["perancu"]
    character: {presenter: "off", mascot: "off"}
    background: "navy"
    template: "definition_card"
    props:
      headline: "NAMANYA CONFOUNDER"
      headline_accent: ["CONFOUNDER"]
      term: "CONFOUNDER"
      definition: "Faktor tersembunyi yang memengaruhi dua hal sekaligus."
      data_label: "ISTILAH"
      diagram: {z: "cuaca panas", x: "es krim", y: "tenggelam", xy_label: "korelasi palsu"}
    duration_hint_seconds: 5.5
    beats:
      - {at: 0.0, target: headline, action: slide}
      - {at: 0.0, target: x, action: pop}
      - {at: 0.05, target: y, action: pop}
      - {at: 0.1, target: xy, action: draw}
      - {at: "word:tersembunyi", target: z, action: pop}
      - {at: "word:seperti", target: arrow-zx, action: draw}
      - {at: "word:seperti", target: arrow-zy, action: draw}
      - {at: "caption:1", target: card, action: pop}
      - {at: "caption:1", target: definition, action: slide}
      - {at: "word:confounder", target: term, action: pop}
      - {at: "word:confounder", target: label, action: pop}
      - {at: "word:perancu", target: term, action: highlight}

  - id: check-it
    title: "Cara mengecek"
    purpose: "Satu cara sederhana menguji dugaan confounder."
    narration: "Cara mengeceknya: bandingkan hari-hari yang sama panasnya. Kalau hubungannya hilang, cuaca panaslah penyebabnya."
    captions:
      - text: "Cara mengeceknya:"
      - text: "bandingkan hari-hari"
        highlight: ["bandingkan"]
      - text: "yang sama panasnya."
      - text: "Kalau hubungannya hilang,"
        highlight: ["hilang"]
      - text: "cuaca panaslah penyebabnya."
        highlight: ["penyebabnya"]
    character: {presenter: "off", mascot: "off"}
    background: "navy_dark"
    template: "compare"
    props:
      headline: "CARA MENGECEKNYA"
      headline_accent: ["MENGECEKNYA"]
      items:
        - {icon: thermometer, term: "SAMA PANAS", definition: "Bandingkan hari dengan suhu yang sama"}
        - {icon: magnifier, term: "HUBUNGAN HILANG", definition: "Es krim tak lagi terkait tenggelam"}
      divider: "LALU"
    duration_hint_seconds: 8.0
    source_notes:
      - "Ilustrasi logika stratifikasi, bukan hasil studi."
    beats:
      - {at: 0.0, target: headline, action: slide}
      - {at: 0.02, target: side-0, action: pop}
      - {at: "word:bandingkan", target: side-0, action: highlight}
      - {at: "word:Kalau", target: vs, action: pop}
      - {at: "word:hilang", target: side-1, action: slide}
      - {at: "word:penyebabnya", target: side-1, action: highlight}

  # ── 4 · CONTOH NYATA ───────────────────────────────────────────────────────
  - id: work-example
    title: "Contoh di dunia kerja"
    purpose: "Pola yang sama di konteks yang dekat dengan audiens."
    narration: "Misalnya di sebuah kantor, karyawan yang sering ikut pelatihan, gajinya lebih tinggi."
    captions:
      - text: "Misalnya di sebuah kantor,"
      - text: "karyawan yang sering ikut pelatihan,"
        highlight: ["pelatihan"]
      - text: "gajinya lebih tinggi."
        highlight: ["lebih tinggi"]
    character: {presenter: "off", mascot: "off"}
    background: "purple"
    template: "title_question"
    props:
      chapter: "4 · Contoh nyata"
      headline: "DI DUNIA KERJA"
      side_icons:
        - {icon: book, label: "Pelatihan", trend: up}
        - {icon: coin, label: "Gaji", trend: up}
    duration_hint_seconds: 6.0
    source_notes:
      - "Skenario hipotetis untuk ilustrasi; bukan klaim tentang perusahaan nyata."
    beats:
      - {at: 0.02, target: headline, action: slide}
      - {at: "word:pelatihan", target: side-0, action: pop}
      - {at: "word:gajinya", target: side-1, action: pop}
      - {at: "word:tinggi", target: rule, action: draw}

  - id: work-confounder
    title: "Faktor ketiga di kantor"
    purpose: "Menerapkan logika confounder ke contoh dunia kerja."
    narration: "Apakah pelatihan pasti menaikkan gaji? Belum tentu. Bisa jadi faktornya jabatan: karyawan senior lebih sering dikirim pelatihan, dan gajinya memang lebih tinggi."
    captions:
      - text: "Apakah pelatihan pasti menaikkan gaji?"
      - text: "Belum tentu."
        highlight: ["Belum tentu"]
      - text: "Bisa jadi faktornya jabatan:"
        highlight: ["jabatan"]
      - text: "karyawan senior lebih sering"
      - text: "dikirim pelatihan,"
      - text: "dan gajinya memang lebih tinggi."
    character: {presenter: "off", mascot: "off"}
    background: "teal"
    template: "causal_diagram"
    props:
      headline: "FAKTOR KETIGA DI KANTOR"
      headline_accent: ["KANTOR"]
      nodes:
        - {id: seniority, label: "Jabatan senior", icon: briefcase}
        - {id: training, label: "Lebih sering pelatihan", icon: book}
        - {id: salary, label: "Gaji lebih tinggi", icon: coin}
      false_link: true
      data_label: "Ilustrasi"
    duration_hint_seconds: 10.5
    beats:
      - {at: 0.0, target: headline, action: slide}
      - {at: 0.0, target: node-1, action: pop}
      - {at: 0.0, target: node-2, action: pop}
      - {at: 0.03, target: false-link, action: draw}
      - {at: "word:Belum", target: false-x, action: pop}
      - {at: "word:jabatan", target: node-0, action: pop}
      - {at: "word:dikirim", target: arrow-1, action: draw}
      - {at: "word:dikirim", target: node-1, action: highlight}
      - {at: "word:gajinya", target: arrow-2, action: draw}
      - {at: "word:gajinya", target: node-2, action: highlight}
      - {at: 0.95, target: label, action: pop}

  # ── 5 · KESALAHAN UMUM ─────────────────────────────────────────────────────
  - id: mistake-reverse
    title: "Kesalahan 1: arah terbalik"
    purpose: "Menunjukkan bahwa arah sebab-akibat bisa terbalik."
    narration: "Kesalahan pertama: lupa arah sebaliknya. Bisa jadi gaji tinggi yang membuat orang mampu ikut pelatihan."
    captions:
      - text: "Kesalahan pertama:"
        highlight: ["pertama"]
      - text: "lupa arah sebaliknya."
        highlight: ["sebaliknya"]
      - text: "Bisa jadi gaji tinggi"
      - text: "yang membuat orang mampu"
      - text: "ikut pelatihan."
    character: {presenter: "off", mascot: "off"}
    background: "coral"
    template: "question_link"
    props:
      headline: "KESALAHAN 1"
      headline_accent: ["1"]
      labels:
        - {label: "Gaji tinggi", icon: coin}
        - {icon: question}
        - {label: "Ikut pelatihan", icon: book}
      supporting_text: "Arahnya bisa terbalik"
    duration_hint_seconds: 7.5
    beats:
      - {at: 0.0, target: headline, action: slide}
      - {at: 0.02, target: item-0, action: pop}
      - {at: "word:gaji", target: item-0, action: highlight}
      - {at: "word:membuat", target: link-0, action: draw}
      - {at: "word:membuat", target: item-1, action: pop}
      - {at: "word:pelatihan", target: link-1, action: draw}
      - {at: "word:pelatihan", target: item-2, action: pop}
      - {at: 0.9, target: supporting, action: pop}

  - id: mistake-chance
    title: "Kesalahan 2: kebetulan"
    purpose: "Data sedikit bisa memunculkan pola palsu."
    narration: "Kesalahan kedua: menganggap kebetulan sebagai pola. Dengan data sedikit, dua hal acak pun bisa terlihat berhubungan."
    captions:
      - text: "Kesalahan kedua:"
        highlight: ["kedua"]
      - text: "menganggap kebetulan sebagai pola."
        highlight: ["kebetulan"]
      - text: "Dengan data sedikit,"
      - text: "dua hal acak pun"
      - text: "bisa terlihat berhubungan."
    character: {presenter: "off", mascot: "off"}
    background: "navy_dark"
    template: "scatter_regression"
    props:
      headline: "KESALAHAN 2"
      headline_accent: ["2"]
      conclusion: "Bisa cuma kebetulan"
    duration_hint_seconds: 8.0
    source_notes:
      - "Titik-titik ilustratif; tidak ada angka yang diklaim."
    beats:
      - {at: 0.0, target: headline, action: slide}
      - {at: 0.02, target: chart, action: draw, duration: 2.0}
      - {at: "word:berhubungan", target: trend, action: draw}
      - {at: "word:berhubungan", target: conclusion, action: pop}
      - {at: 0.94, target: label, action: pop}

  - id: mistake-strong
    title: "Kesalahan 3: kuat berarti sebab"
    purpose: "Menegaskan bahwa korelasi sekuat apa pun bukan bukti sebab-akibat."
    narration: "Kesalahan ketiga: mengira korelasi kuat pasti sebab-akibat. Sekuat apa pun, tetap perlu dicek faktor ketiganya."
    captions:
      - text: "Kesalahan ketiga:"
        highlight: ["ketiga"]
      - text: "mengira korelasi kuat"
      - text: "pasti sebab-akibat."
        highlight: ["sebab-akibat"]
      - text: "Sekuat apa pun,"
      - text: "tetap perlu dicek faktor ketiganya."
        highlight: ["faktor ketiganya"]
    character: {presenter: "off", mascot: "off"}
    background: "navy"
    template: "compare"
    props:
      headline: "KESALAHAN 3"
      headline_accent: ["3"]
      items:
        - {icon: together, term: "KORELASI KUAT", definition: "Es krim & tenggelam naik bareng"}
        - {icon: magnifier, term: "BELUM BUKTI", definition: "Cek dulu: ada cuaca panas di baliknya"}
      divider: "TAPI"
    duration_hint_seconds: 8.0
    beats:
      - {at: 0.0, target: headline, action: slide}
      - {at: 0.02, target: side-0, action: pop}
      - {at: "word:korelasi", target: side-0, action: highlight}
      - {at: "word:Sekuat", target: vs, action: pop}
      - {at: "word:dicek", target: side-1, action: slide}
      - {at: "word:ketiganya", target: side-1, action: highlight}

  # ── 6 · RANGKUMAN ──────────────────────────────────────────────────────────
  - id: recap
    title: "Rangkuman"
    purpose: "Satu kebiasaan yang bisa langsung dipakai penonton."
    narration: "Jadi, korelasi membantu kita menemukan pola. Tapi sebelum bilang A menyebabkan B, cari dulu faktor ketiganya."
    captions:
      - text: "Jadi, korelasi membantu kita"
      - text: "menemukan pola."
        highlight: ["pola"]
      - text: "Tapi sebelum bilang"
      - text: "A menyebabkan B,"
      - text: "cari dulu faktor ketiganya."
        highlight: ["faktor ketiganya"]
    character: {presenter: "off", mascot: "on", mascot_pose: "explaining", expression: "thinking"}
    background: "purple"
    template: "title_question"
    props:
      chapter: "6 · Rangkuman"
      headline: "CARI FAKTOR KETIGANYA"
      side_icons:
        - {icon: magnifier, label: "Cari"}
        - {icon: sun, label: "Faktor ketiga"}
    duration_hint_seconds: 8.0
    beats:
      - {at: 0.03, target: headline, action: slide}
      - {at: "word:pola", target: side-0, action: pop}
      - {at: "word:cari", target: side-1, action: pop}
      - {at: "word:cari", target: rule, action: draw}
      - {at: "word:cari", target: nodi, action: "pose:cheer"}
      - {at: "word:cari", target: nodi, action: "expr:excited"}
