sources: []
# Pilot short, re-authored for motion: 7 scenes, a visual change roughly every 2 s via beats.
# NODI appears in the hook, the question and the close; explanation scenes are full-screen.
scenes:
  - id: hook
    title: "Hook"
    purpose: "Membuka dengan pola yang sering disalahpahami."
    narration: "Dua hal sering terjadi bersamaan. Kita langsung menyimpulkan yang satu menyebabkan yang lain."
    captions:
      - text: "Dua hal terjadi bersamaan"
      - text: "Kita langsung menyimpulkan"
        highlight: ["menyimpulkan"]
    character:
      presenter: "off"
      mascot: "on"
      mascot_pose: "wave"
      expression: "happy"
    background: "purple"
    template: "title_question"
    props:
      headline: "KORELASI ≠ KAUSALITAS"
    duration_hint_seconds: 5.0
    beats:
      - {at: 0.05, target: headline, action: slide}
      - {at: "caption:1", target: rule, action: draw}
      - {at: "caption:1", target: nodi, action: "expr:curious"}
      - {at: "caption:1", target: nodi, action: "pose:rest"}
      - {at: 0.85, target: headline, action: highlight}

  - id: question
    title: "Pertanyaan"
    purpose: "Menantang asumsi sebab-akibat."
    narration: "Tapi, benarkah begitu?"
    captions:
      - text: "Tapi, benarkah begitu?"
        highlight: ["benarkah"]
    character:
      presenter: "off"
      mascot: "on"
      mascot_pose: "shrug"
      expression: "skeptical"
    background: "teal"
    template: "title_question"
    props:
      headline: "SEBAB-AKIBAT?"
    duration_hint_seconds: 2.6
    beats:
      - {at: 0.0, target: headline, action: pop}
      - {at: 0.45, target: rule, action: draw}
      - {at: 0.55, target: headline, action: highlight}

  - id: example
    title: "Contoh"
    purpose: "Memperlihatkan dua variabel yang naik bersamaan."
    narration: "Contohnya, saat penjualan es krim naik, kasus kulit terbakar matahari juga ikut naik."
    captions:
      - text: "Penjualan es krim naik"
      - text: "Kulit terbakar matahari"
      - text: "juga ikut naik"
        highlight: ["ikut naik"]
    character:
      presenter: "off"
      mascot: "off"
    background: "purple"
    template: "paired_trend"
    props:
      variables: ["Penjualan es krim", "Kasus kulit terbakar matahari"]
      icons: [ice_cream, sunburn]
      data_label: "Ilustrasi"
    duration_hint_seconds: 6.5
    source_notes:
      - "Contoh ilustratif; jangan tampilkan sebagai statistik faktual."
    beats:
      - {at: 0.02, target: chart-0, action: draw, duration: 1.6}
      - {at: "word:naik", target: chart-0, action: highlight}
      - {at: "word:kulit", target: chart-1, action: draw, duration: 1.6}
      - {at: "caption:2", target: chart-1, action: highlight}
      - {at: "caption:2", target: chart-0, action: highlight}
      - {at: 0.85, target: label, action: pop}

  - id: tempting
    title: "Kesimpulan menggoda"
    purpose: "Menunjukkan lompatan logika yang keliru."
    narration: "Apakah es krim membuat kulit terbakar? Tentu tidak."
    captions:
      - text: "Es krim bikin kulit terbakar?"
        highlight: ["?"]
      - text: "Tentu tidak."
        highlight: ["tidak"]
    character:
      presenter: "off"
      mascot: "off"
    background: "deep_blue"
    template: "question_link"
    props:
      labels:
        - {label: "Es krim", icon: ice_cream}
        - {icon: question}
        - {label: "Kulit terbakar", icon: sunburn}
      supporting_text: "Bersamaan ≠ menyebabkan"
    duration_hint_seconds: 4.2
    beats:
      - {at: 0.02, target: item-0, action: pop}
      - {at: "word:membuat", target: link-0, action: slide}
      - {at: "word:membuat", target: item-1, action: pop}
      - {at: "word:kulit", target: link-1, action: slide}
      - {at: "word:kulit", target: item-2, action: pop}
      - {at: "caption:1", target: supporting, action: pop}
      - {at: "caption:1", target: item-1, action: highlight}

  - id: hidden-factor
    title: "Faktor ketiga"
    purpose: "Menjelaskan variabel perancu sebagai penjelasan alternatif."
    narration: "Ternyata ada faktor ketiga: cuaca panas. Cuaca panas membuat orang membeli es krim, sekaligus berjemur lebih lama di bawah matahari."
    captions:
      - text: "Ada faktor ketiga"
        highlight: ["faktor ketiga"]
      - text: "Cuaca panas"
        highlight: ["panas"]
      - text: "Orang membeli es krim"
      - text: "sekaligus berjemur lebih lama"
    character:
      presenter: "off"
      mascot: "off"
    background: "teal"
    template: "causal_diagram"
    props:
      nodes:
        - {id: weather, label: "Cuaca panas", icon: sun}
        - {id: ice_cream, label: "Penjualan es krim", icon: ice_cream}
        - {id: sunburn, label: "Kulit terbakar matahari", icon: sunburn}
      data_label: "Ilustrasi"
    duration_hint_seconds: 8.5
    beats:
      - {at: 0.02, target: node-0, action: pop}
      - {at: "word:cuaca", target: node-0, action: highlight}
      - {at: "caption:2", target: arrow-1, action: draw}
      - {at: "word:es", target: node-1, action: pop}
      - {at: "word:sekaligus", target: arrow-2, action: draw}
      - {at: "word:berjemur", target: node-2, action: pop}
      - {at: 0.9, target: label, action: pop}

  - id: difference
    title: "Bedanya"
    purpose: "Merumuskan beda korelasi dan kausalitas."
    narration: "Korelasi artinya dua hal bergerak bersama. Kausalitas artinya yang satu benar-benar menyebabkan yang lain."
    captions:
      - text: "Korelasi: bergerak bersama"
        highlight: ["Korelasi"]
      - text: "Kausalitas: yang satu menyebabkan"
        highlight: ["Kausalitas"]
    character:
      presenter: "off"
      mascot: "off"
    background: "deep_blue"
    template: "takeaway"
    props:
      points:
        - "Korelasi = dua hal bergerak bersama"
        - "Kausalitas = yang satu menyebabkan yang lain"
    duration_hint_seconds: 6.5
    beats:
      - {at: 0.02, target: point-0, action: slide}
      - {at: "word:bergerak", target: point-0, action: highlight}
      - {at: "caption:1", target: point-1, action: slide}
      - {at: "word:benar-benar", target: point-1, action: highlight}
      - {at: 0.92, target: point-0, action: highlight}

  - id: close
    title: "Penutup"
    purpose: "Memberi aturan praktis yang mudah diingat."
    narration: "Jadi, sebelum menyimpulkan sebab-akibat, cari dulu faktor ketiganya."
    captions:
      - text: "Sebelum menyimpulkan sebab-akibat"
      - text: "cari faktor ketiganya!"
        highlight: ["faktor ketiganya"]
    character:
      presenter: "off"
      mascot: "on"
      mascot_pose: "explaining"
      expression: "thinking"
    background: "coral"
    template: "title_question"
    props:
      headline: "CARI FAKTOR KETIGANYA"
    duration_hint_seconds: 5.0
    beats:
      - {at: 0.03, target: headline, action: slide}
      - {at: 0.3, target: nodi, action: "expr:curious"}
      - {at: "caption:1", target: rule, action: draw}
      - {at: "caption:1", target: nodi, action: "pose:cheer"}
      - {at: "caption:1", target: nodi, action: "expr:excited"}
      - {at: 0.8, target: headline, action: highlight}
