schema_version: 2
meta:
  id: fondasi-01-korelasi-bukan-kausalitas-short
  title: "Korelasi Bukan Kausalitas"
  series: "Fondasi"
  episode: "01"
  format: short
  language: id-ID
  fps: 30
  width: 1080
  height: 1920
  paired_episode_id: fondasi-01-korelasi-bukan-kausalitas-long
  status: draft
voice:
  provider: elevenlabs
  speed: 1.0
editorial_status: draft
sources: []
# Pilot short v3 — re-authored for CLARITY (see CLAUDE.md "Clarity rules" and
# docs/HANDOFF_CLARITY.md): concrete example first, captions = narration verbatim,
# the assumed link is drawn then crossed out, causes are drawn one arrow at a time,
# and the definitions are tied to this episode's example.
scenes:
  - id: hook
    title: "Hook"
    purpose: "Fakta konkret yang terdengar aneh: dua hal naik bersamaan."
    narration: "Tahu nggak? Saat penjualan es krim naik, kasus orang tenggelam juga ikut naik."
    captions:
      - text: "Tahu nggak?"
      - text: "Saat penjualan es krim naik,"
        highlight: ["es krim"]
      - text: "kasus orang tenggelam"
        highlight: ["tenggelam"]
      - text: "juga ikut naik."
        highlight: ["ikut naik"]
    character:
      presenter: "off"
      mascot: "on"
      mascot_pose: "wave"
      expression: "happy"
    background: "paper"
    template: "title_question"
    props:
      headline: "FAKTA ANEH"
      side_icons:
        - {icon: ice_cream, label: "Es krim", trend: up}
        - {icon: swimmer, label: "Tenggelam", trend: up}
    duration_hint_seconds: 5.0
    beats:
      - {at: 0.02, target: headline, action: slide}
      - {at: "caption:1", target: nodi, action: "pose:explaining"}
      - {at: "word:es", target: side-0, action: pop}
      - {at: "word:tenggelam", target: side-1, action: pop}
      - {at: "caption:3", target: rule, action: draw}
      - {at: "caption:3", target: side-0, action: highlight}
      - {at: "caption:3", target: side-1, action: highlight}
      - {at: "caption:3", target: nodi, action: "expr:surprised"}

  - id: example
    title: "Data"
    purpose: "Memperlihatkan bahwa dua variabel bergerak bersama (korelasi)."
    narration: "Kalau datanya kita plot, dua garis ini naik turun hampir bareng."
    captions:
      - text: "Kalau datanya kita plot,"
        highlight: ["plot"]
      - text: "dua garis ini naik turun"
      - text: "hampir bareng."
        highlight: ["bareng"]
    character:
      presenter: "off"
      mascot: "off"
    background: "paper"
    template: "paired_trend"
    props:
      variables: ["Penjualan es krim", "Kasus tenggelam"]
      icons: [ice_cream, swimmer]
      series:
        - [30, 38, 52, 70, 86, 95]
        - [9, 12, 14, 21, 22, 28]
      x_labels: ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun"]
      conclusion: "Naik bareng!"
      show_r: true
      data_label: "Ilustrasi"
    duration_hint_seconds: 4.5
    source_notes:
      - "Data ilustratif; r dihitung dari angka di spec, bukan statistik faktual."
    beats:
      - {at: 0.02, target: axes, action: draw}
      - {at: "word:plot", target: chart-0, action: draw, duration: 1.4}
      - {at: "word:garis", target: chart-1, action: draw, duration: 1.4}
      - {at: "caption:2", target: conclusion, action: pop}
      - {at: "caption:2", target: chart-0, action: highlight}
      - {at: "caption:2", target: chart-1, action: highlight}
      - {at: 0.82, target: r, action: pop}
      - {at: 0.9, target: label, action: pop}

  - id: question
    title: "Kesimpulan menggoda"
    purpose: "Menyuarakan lompatan logika yang keliru, tanpa langsung menjawabnya."
    narration: "Jadi... makan es krim bikin orang tenggelam?"
    captions:
      - text: "Jadi..."
      - text: "makan es krim bikin"
      - text: "orang tenggelam?"
        highlight: ["tenggelam?"]
    character:
      presenter: "off"
      mascot: "on"
      mascot_pose: "shrug"
      expression: "skeptical"
    background: "yellow"
    template: "title_question"
    props:
      headline: "ES KRIM → TENGGELAM?"
      side_icons:
        - {icon: ice_cream}
        - {icon: swimmer}
    duration_hint_seconds: 3.2
    beats:
      - {at: 0.0, target: headline, action: pop}
      - {at: "word:es", target: side-0, action: pop}
      - {at: "word:tenggelam", target: side-1, action: pop}
      - {at: 0.8, target: rule, action: draw}
      - {at: 0.8, target: headline, action: highlight}

  - id: hidden-factor
    title: "Faktor ketiga"
    purpose: "Mencoret hubungan yang diasumsikan, lalu menggambar penyebab sebenarnya."
    narration: "Bukan. Ada faktor ketiga: cuaca panas. Saat panas, orang beli es krim, dan lebih banyak yang berenang."
    captions:
      - text: "Bukan."
        highlight: ["Bukan"]
      - text: "Ada faktor ketiga:"
        highlight: ["faktor ketiga"]
      - text: "cuaca panas."
        highlight: ["panas"]
      - text: "Saat panas,"
      - text: "orang beli es krim,"
        highlight: ["es krim"]
      - text: "dan lebih banyak yang berenang."
        highlight: ["berenang"]
    character:
      presenter: "off"
      mascot: "off"
    background: "navy"
    template: "causal_diagram"
    props:
      nodes:
        - {id: weather, label: "Cuaca panas", icon: sun}
        - {id: ice_cream, label: "Beli es krim", icon: ice_cream}
        - {id: swim, label: "Lebih banyak berenang", icon: swimmer}
      false_link: true
      data_label: "Ilustrasi"
    duration_hint_seconds: 8.0
    beats:
      - {at: 0.0, target: node-1, action: pop}
      - {at: 0.0, target: node-2, action: pop}
      - {at: 0.02, target: false-link, action: draw}
      - {at: "word:Bukan", target: false-x, action: pop}
      - {at: "caption:2", target: node-0, action: pop}
      - {at: "word:beli", target: arrow-1, action: draw}
      - {at: "word:beli", target: node-1, action: highlight}
      - {at: "word:berenang", target: arrow-2, action: draw}
      - {at: "word:berenang", target: node-2, action: highlight}
      - {at: 0.94, target: label, action: pop}

  - id: name-it
    title: "Istilah"
    purpose: "Memberi nama pada faktor ketiga, setelah penonton paham konsepnya."
    narration: "Faktor tersembunyi seperti ini disebut confounder."
    captions:
      - text: "Faktor tersembunyi seperti ini"
      - text: "disebut confounder."
        highlight: ["confounder"]
    character:
      presenter: "off"
      mascot: "off"
    background: "paper"
    template: "definition_card"
    props:
      term: "CONFOUNDER"
      definition: "Faktor tersembunyi yang memengaruhi dua hal sekaligus."
      data_label: "ISTILAH"
      icon: sun
      icon_label: "Di sini: cuaca panas"
    duration_hint_seconds: 3.6
    beats:
      - {at: 0.0, target: card, action: pop}
      - {at: 0.05, target: definition, action: slide}
      - {at: "word:confounder", target: term, action: pop}
      - {at: "word:confounder", target: term, action: highlight}
      - {at: "word:tersembunyi", target: icon, action: pop}
      - {at: "word:confounder", target: label, action: pop}

  - id: difference
    title: "Bedanya, pakai contoh"
    purpose: "Membedakan korelasi dan kausalitas dengan contoh episode ini."
    narration: "Es krim dan tenggelam cuma berkorelasi. Penyebab sebenarnya: cuaca panas."
    captions:
      - text: "Es krim dan tenggelam"
      - text: "cuma berkorelasi."
        highlight: ["berkorelasi"]
      - text: "Penyebab sebenarnya:"
        highlight: ["Penyebab"]
      - text: "cuaca panas."
        highlight: ["panas"]
    character:
      presenter: "off"
      mascot: "off"
    background: "paper"
    template: "compare"
    props:
      items:
        - {icon: together, term: "KORELASI", definition: "Es krim & tenggelam naik bareng"}
        - {icon: sun, term: "KAUSALITAS", definition: "Cuaca panas → lebih banyak berenang"}
      divider: "BEDA"
    duration_hint_seconds: 5.0
    beats:
      - {at: 0.0, target: side-0, action: pop}
      - {at: "word:berkorelasi", target: side-0, action: highlight}
      - {at: "word:Penyebab", target: vs, action: pop}
      - {at: "word:Penyebab", target: side-1, action: slide}
      - {at: "word:panas", target: side-1, action: highlight}

  - id: close
    title: "Penutup"
    purpose: "Satu kebiasaan yang bisa langsung dipakai penonton."
    narration: "Jadi, sebelum bilang A menyebabkan B, cari dulu faktor ketiganya."
    captions:
      - text: "Jadi, sebelum bilang"
      - text: "A menyebabkan B,"
      - text: "cari dulu faktor ketiganya."
        highlight: ["faktor ketiganya"]
    character:
      presenter: "off"
      mascot: "on"
      mascot_pose: "explaining"
      expression: "thinking"
    background: "coral"
    template: "title_question"
    props:
      headline: "CARI FAKTOR KETIGANYA"
    duration_hint_seconds: 4.4
    beats:
      - {at: 0.05, target: headline, action: slide}
      - {at: "caption:2", target: rule, action: draw}
      - {at: "caption:2", target: headline, action: highlight}
      - {at: "caption:2", target: nodi, action: "pose:cheer"}
      - {at: "caption:2", target: nodi, action: "expr:excited"}
