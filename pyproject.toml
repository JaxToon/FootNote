[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fn-footnote-video"
version = "0.1.0"
description = "Local-first spec-driven video production pipeline for F/N — FOOTNOTE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "numpy>=2.0,<3",
  "Pillow>=10.4,<12",
  "playwright>=1.48,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "mypy>=1.10,<2"]

[project.scripts]
fnvideo = "fnvideo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fnvideo = ["render/assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Line length is enforced by `ruff format`; long SVG markup/message strings are allowed.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
